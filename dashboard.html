<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Chatbot WhatsApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 {
      padding: 16px;
      font-size: 18px;
      border-bottom: 1px solid #334155;
      background: #0f172a;
    }
    .status-box {
      padding: 16px;
      border-bottom: 1px solid #334155;
    }
    .status-label { font-size: 12px; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }
    .status-connecting { background: #f59e0b; color: #0f172a; }
    .status-qr { background: #f59e0b; color: #0f172a; }
    .status-ready { background: #10b981; color: #fff; }
    .status-disconnected { background: #ef4444; color: #fff; }
    .status-auth_failure { background: #ef4444; color: #fff; }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .chat-item {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.2s;
      border-left: 3px solid transparent;
    }
    .chat-item:hover, .chat-item.active {
      background: #334155;
    }
    .chat-item.active { border-left-color: #10b981; }
    .chat-number { font-weight: 600; font-size: 14px; }
    .chat-name { font-size: 12px; color: #94a3b8; }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 16px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 18px; }
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .chat-panel {
      flex: 2;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
    }
    .chat-header {
      padding: 14px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-weight: 600;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
    }
    .msg-user {
      background: #2563eb;
      align-self: flex-end;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .msg-bot {
      background: #334155;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg-time {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      display: block;
      text-align: right;
    }
    .log-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 280px;
    }
    .log-header {
      padding: 14px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-weight: 600;
    }
    .logs {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-family: 'Consolas', monospace;
      font-size: 12px;
    }
    .log-line {
      padding: 4px 0;
      border-bottom: 1px solid #1e293b;
      color: #cbd5e1;
    }
    .log-time { color: #64748b; margin-right: 8px; }
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
      font-size: 14px;
    }
    .badge-count {
      background: #10b981;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Chats</h2>
    <div class="status-box">
      <div class="status-label">Estado del bot</div>
      <div id="statusBadge" class="status-badge status-connecting">Conectando...</div>
    </div>
    <div class="chat-list" id="chatList">
      <div class="empty-state">Esperando mensajes...</div>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <h1>Dashboard Chatbot WhatsApp + Gemini</h1>
      <span style="color:#64748b;font-size:13px">Puerto 3000</span>
    </div>
    <div class="content">
      <div class="chat-panel">
        <div class="chat-header" id="chatHeader">Selecciona un chat</div>
        <div class="messages" id="messages">
          <div class="empty-state">Selecciona un chat de la izquierda para ver la conversacion.</div>
        </div>
      </div>
      <div class="log-panel">
        <div class="log-header">Logs del sistema</div>
        <div class="logs" id="logs"></div>
      </div>
    </div>
  </div>

  <script>
    const state = { chats: {}, logs: [], status: 'connecting' };
    let activeChat = null;

    function setStatus(status) {
      const badge = document.getElementById('statusBadge');
      badge.className = 'status-badge status-' + status;
      const labels = {
        connecting: 'Conectando...',
        qr: 'Esperando QR',
        ready: 'Conectado',
        disconnected: 'Desconectado',
        auth_failure: 'Fallo auth'
      };
      badge.textContent = labels[status] || status;
    }

    function renderChatList() {
      const list = document.getElementById('chatList');
      const ids = Object.keys(state.chats);
      if (ids.length === 0) {
        list.innerHTML = '<div class="empty-state">Esperando mensajes...</div>';
        return;
      }
      list.innerHTML = ids.map(id => {
        const c = state.chats[id];
        const cls = id === activeChat ? 'chat-item active' : 'chat-item';
        return `<div class="${cls}" data-id="${id}" onclick="selectChat('${id}')">
          <div class="chat-number">${c.name || c.number} <span class="badge-count">${c.messages.length}</span></div>
          <div class="chat-name">${c.number}</div>
        </div>`;
      }).join('');
    }

    function renderMessages() {
      const box = document.getElementById('messages');
      const header = document.getElementById('chatHeader');
      if (!activeChat || !state.chats[activeChat]) {
        header.textContent = 'Selecciona un chat';
        box.innerHTML = '<div class="empty-state">Selecciona un chat de la izquierda para ver la conversacion.</div>';
        return;
      }
      const c = state.chats[activeChat];
      header.textContent = c.name ? `${c.name} (${c.number})` : c.number;
      box.innerHTML = c.messages.map(m =>
        `<div class="msg msg-${m.role}">${escapeHtml(m.text)}<span class="msg-time">${m.time}</span></div>`
      ).join('');
      box.scrollTop = box.scrollHeight;
    }

    function renderLogs() {
      const box = document.getElementById('logs');
      box.innerHTML = state.logs.map(l =>
        `<div class="log-line"><span class="log-time">${l.time}</span>${escapeHtml(l.text)}</div>`
      ).join('');
      box.scrollTop = box.scrollHeight;
    }

    function selectChat(id) {
      activeChat = id;
      renderChatList();
      renderMessages();
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function connectSSE() {
      const evt = new EventSource('/events');
      evt.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'init') {
          Object.assign(state, data.payload);
          setStatus(state.status);
          renderChatList();
          renderMessages();
          renderLogs();
        } else if (data.type === 'status') {
          state.status = data.payload.status;
          setStatus(state.status);
        } else if (data.type === 'log') {
          state.logs.push(data.payload);
          if (state.logs.length > 200) state.logs.shift();
          renderLogs();
        } else if (data.type === 'message') {
          const p = data.payload;
          if (!state.chats[p.chatId]) {
            state.chats[p.chatId] = { number: p.number, name: p.name, messages: [] };
          }
          state.chats[p.chatId].messages.push(p.msg);
          if (state.chats[p.chatId].messages.length > 100) state.chats[p.chatId].messages.shift();
          if (!activeChat) activeChat = p.chatId;
          renderChatList();
          if (activeChat === p.chatId) renderMessages();
        }
      };
      evt.onerror = () => {
        setStatus('disconnected');
      };
    }

    // Carga inicial
    fetch('/api/state').then(r => r.json()).then(data => {
      Object.assign(state, data);
      setStatus(state.status);
      if (Object.keys(state.chats).length > 0 && !activeChat) activeChat = Object.keys(state.chats)[0];
      renderChatList();
      renderMessages();
      renderLogs();
      connectSSE();
    });
  </script>
</body>
</html>
